name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.4"
      - name: Test
        run: swift test

  macos:
    name: macOS build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
