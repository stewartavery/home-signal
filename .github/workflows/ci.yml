name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4@sha256:e508ef1e4be68087f720de622b91cbf1e32799a7aa96134b35e6f1a1d656db7a
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  macos:
    name: macOS build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
